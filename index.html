<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050210">
<title>Nova City RP</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Cinzel:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<!--
شغّل مرة واحدة في Supabase SQL Editor:
create table if not exists kv(id text primary key, data jsonb);
create table if not exists apps(id text primary key, user_id text, ts bigint, data jsonb);
create table if not exists visits(id bigint generated always as identity primary key, ts bigint, data jsonb);
alter table kv enable row level security; alter table apps enable row level security; alter table visits enable row level security;
create policy "kv all" on kv for all using(true) with check(true);
create policy "apps all" on apps for all using(true) with check(true);
create policy "visits all" on visits for all using(true) with check(true);
-->
<style>
:root{--bg:#050210;--p:#7c3aed;--c:#c4b5fd;--g:#e7d6a8;--bd:rgba(167,139,250,.18);--bd2:rgba(167,139,250,.38);--mut:#a79fc0;--no:#fb7185;--ok:#34d399}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:#ece8f7;min-height:100vh;line-height:1.7;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
::selection{background:rgba(139,92,246,.45)}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,.35);border-radius:9px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;filter:brightness(.62) saturate(.9)}
.vig{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 25%,transparent 35%,rgba(2,0,8,.8))}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#prog{position:fixed;top:0;right:0;height:2px;width:0;z-index:99;background:linear-gradient(90deg,#6d28d9,var(--g))}
/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:rgba(8,4,18,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{font-family:'Cinzel',serif;font-weight:900;font-size:1.35rem;letter-spacing:.14em;white-space:nowrap;background:linear-gradient(110deg,#fff 30%,var(--c) 45%,var(--g) 50%,var(--c) 56%,#fff 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 5s linear infinite}
nav{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(139,92,246,.07);border:1px solid var(--bd);overflow-x:auto;scrollbar-width:none;max-width:100%}
nav::-webkit-scrollbar{display:none}
.nb{display:flex;align-items:center;gap:7px;padding:9px 14px;min-height:40px;border-radius:10px;color:var(--mut);font-weight:700;font-size:.85rem;white-space:nowrap;transition:.2s}
.nb:hover{color:#fff;background:rgba(139,92,246,.16)}
.nb.on{color:#fff;background:rgba(139,92,246,.3);box-shadow:inset 0 0 0 1px rgba(196,181,253,.3)}
.auth{display:flex;align-items:center;gap:8px}
.dc{display:flex;align-items:center;gap:9px;background:#5865F2;color:#fff;padding:9px 16px;border-radius:12px;font-weight:800;font-size:.85rem}
.ub{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 6px;border-radius:30px;border:1px solid var(--bd2);background:rgba(139,92,246,.12);font-weight:700;font-size:.85rem}
.ub img{width:30px;height:30px;border-radius:50%}
.ib{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--bd)}
@media(max-width:850px){nav{order:3;width:100%}.auth{margin-inline-start:auto}}
/* ---------- layout ---------- */
main{max-width:1100px;margin:0 auto;padding:150px 16px 40px;min-height:100vh}
@media(min-width:851px){main{padding-top:110px}}
.sec{display:none}
.sec.on{display:block;animation:secIn .5s cubic-bezier(.2,.8,.2,1)}
.card{position:relative;overflow:hidden;margin-bottom:20px;padding:clamp(18px,4vw,30px);border-radius:22px;border:1px solid var(--bd);background:linear-gradient(180deg,rgba(22,11,46,.74),rgba(8,4,20,.88));box-shadow:0 18px 48px rgba(3,1,10,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.card::before{content:"";position:absolute;top:0;left:-40%;width:40%;height:1px;background:linear-gradient(90deg,transparent,var(--g),transparent);animation:sweep 6s linear infinite}
h2{font-size:clamp(1.4rem,4.5vw,2rem);font-weight:900}
h3{font-weight:800}
.fg{margin-bottom:14px}
.fg label{display:block;margin-bottom:6px;font-weight:700;color:var(--c);font-size:.9rem}
.fg input,.fg select,.fg textarea,.in{width:100%;padding:12px 14px;border-radius:12px;font-size:16px;outline:none;background:rgba(8,4,18,.75);border:1px solid var(--bd);transition:.2s}
.fg input:focus,.fg select:focus,.fg textarea:focus,.in:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(139,92,246,.25)}
select option{background:#120a26}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 24px;border-radius:13px;font-weight:800;color:#fff;text-decoration:none;background:linear-gradient(180deg,#8b5cf6,#6d28d9);border:1px solid rgba(196,181,253,.35);box-shadow:0 8px 22px rgba(109,40,217,.38);transition:.2s}
.btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);animation:glint 4.5s infinite}
.btn.alt{background:linear-gradient(180deg,#5865F2,#4752c4)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none}
.btn.full{width:100%}
.mini{padding:6px 12px;border-radius:8px;font-weight:800;font-size:.8rem;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ed{padding:12px;margin-bottom:10px;border-radius:14px;border:1px solid var(--bd);background:rgba(10,5,22,.5)}
.ed .in{margin-bottom:8px}
.ed input[type=checkbox]{width:auto}
.tk{padding:14px;margin-bottom:12px;border-radius:14px;border:1px solid var(--bd);background:rgba(10,5,22,.55)}
.sb{padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:800;border:1px solid var(--g);color:var(--g)}
/* ---------- hero ---------- */
.hero{padding:clamp(24px,8vw,90px) 4px 30px;position:relative}
.hero h1{font-size:clamp(2.4rem,9vw,5rem);font-weight:900;line-height:1.15}
.hero h1 span{display:inline-block;opacity:0;background:linear-gradient(110deg,#fff 30%,var(--c) 45%,var(--g) 50%,var(--c) 56%,#fff 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:wIn 1s cubic-bezier(.2,.9,.2,1) forwards,shine 6s linear infinite;animation-delay:calc(var(--k)*.16s + .2s),1.4s}
.type{min-height:2rem;margin-top:14px;font-size:clamp(1rem,3.4vw,1.35rem);font-weight:700;color:var(--c)}
.type::after{content:"";display:inline-block;width:2px;height:1.1em;margin-inline-start:4px;vertical-align:-.15em;background:var(--c);animation:blink .9s steps(1) infinite}
.emb{position:absolute;inset-inline-end:2%;top:50%;width:min(40vw,380px);aspect-ratio:1;transform:translateY(-50%);pointer-events:none;opacity:.9}
.emb i{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(196,181,253,.38);animation:spin 42s linear infinite}
.emb i:nth-child(2){inset:12%;border:1px solid rgba(231,214,168,.3);animation-direction:reverse;animation-duration:30s}
.emb i:nth-child(3){inset:26%;border:1px dotted rgba(167,139,250,.6);animation-duration:20s}
.emb i:nth-child(4){inset:40%;border:2px solid transparent;border-top-color:#a78bfa;border-bottom-color:rgba(231,214,168,.7);animation-duration:9s}
.emb b{position:absolute;inset:46%;border-radius:50%;background:radial-gradient(circle,#fff,#a78bfa 40%,transparent 70%);animation:pulse 3s infinite}
@media(max-width:850px){.emb{opacity:.3;inset-inline-end:-20%;width:75vw}}
.tick{overflow:hidden;direction:ltr;margin:6px 0 24px;border-block:1px solid var(--bd);background:rgba(10,5,22,.45);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.trk{display:flex;gap:44px;width:max-content;padding:12px 0;animation:mq 34s linear infinite}
.trk span{white-space:nowrap;font-weight:800;color:var(--c);direction:rtl}
.trk span::before{content:"◆";color:var(--g);margin-inline-end:44px;font-size:.6rem}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.mc{position:relative;overflow:hidden;text-align:start;padding:20px 18px;border-radius:18px;border:1px solid var(--bd);background:linear-gradient(160deg,rgba(30,14,60,.8),rgba(8,4,20,.9));transition:.25s}
.mc::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,var(--ac),transparent 60%);opacity:.14}
.mc i{display:block;margin-bottom:10px;font-size:1.5rem;color:var(--ac);filter:drop-shadow(0 0 10px var(--ac))}
.mc b{display:block}
.mc small{color:var(--mut);font-size:.8rem}
.mc:hover{transform:translateY(-5px);border-color:var(--ac)}
/* ---------- status ---------- */
.stc{position:relative;max-width:760px;margin:0 auto;padding:26px 22px 18px;border-radius:24px;text-align:center;border:1px solid rgba(167,139,250,.4);background:radial-gradient(circle at 50% 0,#2a1260,#0a0420 70%);box-shadow:0 0 60px rgba(109,40,217,.3),inset 0 0 0 6px rgba(5,2,16,.6),inset 0 0 0 7px rgba(231,214,168,.25)}
.stt{display:flex;justify-content:space-between;direction:ltr;font-size:.78rem;font-weight:800;letter-spacing:.15em;color:var(--c)}
.stt span:last-child{color:var(--g)}
.stc h2{margin:10px 0 4px;font-size:clamp(2rem,8vw,3.6rem);color:var(--c);text-shadow:0 0 34px rgba(167,139,250,.8)}
.sts{margin-bottom:20px;font-size:.75rem;font-weight:800;letter-spacing:.35em;color:#a78bfa}
.str{display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:start;flex-wrap:wrap}
.str>div:first-child{flex:1;min-width:230px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border-radius:14px;direction:ltr;font-weight:900;color:var(--sc);border:2px solid var(--sc);background:rgba(0,0,0,.35);box-shadow:0 0 22px -4px var(--sc)}
.pill i{width:16px;height:16px;border-radius:50%;background:var(--sc);box-shadow:0 0 16px var(--sc);animation:pulse 1.6s infinite}
.pl{margin-top:16px;font-weight:800;letter-spacing:.1em;color:var(--c)}
.pn{font-size:clamp(3.4rem,13vw,5.4rem);font-weight:900;line-height:1.1;color:#fff}
.pn small{font-size:.38em;color:#a78bfa}
.bar{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-top:8px;direction:ltr}
.bar b{height:22px;border-radius:5px;background:rgba(139,92,246,.14);border:1px solid rgba(167,139,250,.2)}
.bar b.f{background:linear-gradient(180deg,var(--sc),#7c3aed);box-shadow:0 0 12px var(--sc)}
.pc{margin-top:4px;text-align:end;direction:ltr;font-weight:800;color:var(--g)}
.comp{position:relative;width:min(36vw,200px);aspect-ratio:1;margin:auto}
.comp i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(196,181,253,.5);animation:spin 30s linear infinite}
.comp i+i{inset:12%;border-style:dashed;animation-direction:reverse}
.comp b{position:absolute;inset:22%;background:linear-gradient(135deg,#fff,#a78bfa);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 14px #a78bfa);animation:pulse 3s infinite}
.sx{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;margin-top:20px}
.sx>div{padding:12px 14px;text-align:start;border-radius:14px;border:1px solid rgba(167,139,250,.4);background:rgba(10,5,24,.6)}
.sx small{display:block;font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--g)}
.sx b{font-size:1.1rem;word-break:break-all}
.msg{margin-top:12px;font-weight:700;color:#ffd98a}
.pw{margin-top:14px;font-size:.8rem;font-weight:800;color:var(--c)}
@media(max-width:560px){.sx{grid-template-columns:1fr}.comp{display:none}.bar b{height:17px}}
/* ---------- streams ---------- */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px;margin-top:18px}
.sc{display:block;overflow:hidden;text-decoration:none;color:#fff;border-radius:24px;border:1px solid var(--bd);background:#07040f;transition:.25s}
.sc:hover{transform:translateY(-5px);border-color:var(--bd2)}
.sc.off{opacity:.5}
.sc.off .th{filter:grayscale(.8)}
.th{position:relative;height:190px;background:#150a30 center/cover}
.th::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#07040f)}
.lv,.vw{position:absolute;top:12px;z-index:2;padding:6px 12px;border-radius:9px;font-size:.8rem;font-weight:900}
.lv{left:12px;display:flex;gap:7px;align-items:center;background:#e53e3e}
.lv i{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.vw{right:12px;background:rgba(0,0,0,.8);color:#ffb84d}
.si{position:relative;z-index:2;display:flex;gap:12px;align-items:center;margin-top:-30px;padding:0 16px}
.si img,.si .av{width:54px;height:54px;border-radius:50%;border:2px solid #f59e0b;object-fit:cover;background:#1a0f33;display:grid;place-items:center}
.si b{display:block;color:#ffb84d}
.si small{font-weight:700;color:var(--g)}
.sf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:14px 16px;border-top:1px solid var(--bd)}
.sf span{font-size:.9rem;font-weight:800}
.sf em{font-style:normal;white-space:nowrap;padding:7px 14px;border-radius:9px;font-size:.8rem;font-weight:800;color:#4ade80;border:1px solid #22c55e;background:rgba(34,197,94,.14)}
/* ---------- apply ---------- */
.ah{text-align:center;padding:10px 0}
.bd{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:30px;font-size:.8rem;font-weight:800;border:1px solid}
.bd i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
.bd.ok{color:var(--ok);background:rgba(52,211,153,.1)}
.bd.no{color:var(--no);background:rgba(251,113,133,.1)}
.ah h2{margin:14px 0 6px;background:linear-gradient(100deg,#fcd34d,#fff,#fcd34d);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:nvG 5s linear infinite}
@keyframes nvG{to{background-position:200% 0}}
/* ---------- terms / modal ---------- */
.ti{padding:14px 16px;margin-bottom:12px;border-radius:14px;border-inline-start:3px solid #8b5cf6;background:rgba(255,255,255,.03)}
.ti h4{margin-bottom:4px;color:var(--c)}
.ti p{font-size:.93rem;line-height:1.9;color:#ddd7ee}
.modal{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;background:rgba(4,2,10,.86);backdrop-filter:blur(10px)}
.modal.on{display:flex}
.mb{width:90%;max-width:400px;padding:26px;border-radius:22px;border:1px solid var(--bd2);background:linear-gradient(160deg,#1a0e34,#0a0516);box-shadow:0 0 70px rgba(109,40,217,.4)}
footer{margin-top:20px;padding:26px 16px calc(env(safe-area-inset-bottom,0px) + 26px);text-align:center;border-top:1px solid var(--bd);background:rgba(5,2,12,.85)}
footer p{color:rgba(255,255,255,.5);font-size:.85rem}
footer b{display:block;margin-top:4px}
footer a{display:inline-block;margin-top:8px;font-weight:700;color:var(--mut);text-decoration:underline}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,160px);max-width:90vw;text-align:center;padding:13px 24px;border-radius:14px;z-index:9999;font-weight:800;border:1px solid var(--bd2);background:rgba(16,9,34,.96);box-shadow:0 10px 40px rgba(76,29,149,.5);transition:transform .45s cubic-bezier(.2,1.2,.4,1)}
#toast.on{transform:translate(-50%,0)}
.on-l{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.on-l span{padding:5px 12px;border-radius:20px;font-size:.8rem;font-weight:700;border:1px solid var(--ok);background:rgba(52,211,153,.12)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:9999;overflow:hidden;background:#02000a;transition:opacity 1.1s}
#intro.out{opacity:0;pointer-events:none}
#ic{position:absolute;inset:0}
.ivig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(2,0,8,.92))}
.lb{position:absolute;left:0;width:100%;height:0;background:#000;z-index:6;transition:height 1.8s cubic-bezier(.2,.9,.2,1)}
.lb.t{top:0}
.lb.b{bottom:0}
#intro.go .lb{height:6vh}
#iname{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;direction:ltr;text-align:center;padding:0 12px;transition:opacity .9s,transform .9s}
#iname.hide{opacity:0;transform:scale(1.1)}
#imono{width:min(28vmin,210px);overflow:visible;filter:drop-shadow(0 0 22px rgba(167,139,250,.75));animation:nvF 6s ease-in-out infinite}
.mp{fill:none;stroke:url(#gg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:mdr 2.4s cubic-bezier(.5,0,.2,1) forwards;animation-delay:1.6s}
.mp.b{animation-delay:2.2s}
.mp.c{stroke-width:3.4;animation-delay:2.8s}
@keyframes mdr{to{stroke-dashoffset:0}}
.iln{height:1px;width:0;background:linear-gradient(90deg,transparent,var(--g),transparent);box-shadow:0 0 14px rgba(231,214,168,.7);animation:iln 1.6s 3.6s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes iln{to{width:min(72vw,740px)}}
#itt{font-family:'Cinzel',serif;font-weight:900;white-space:nowrap;font-size:clamp(1.8rem,9.6vw,6rem);letter-spacing:.5em;opacity:0;filter:blur(18px);background:linear-gradient(100deg,#8a6d2f,#e7d6a8 20%,#fff 32%,#e7d6a8 44%,#c4b5fd 60%,#8a6d2f);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:itr 2.6s 3.6s cubic-bezier(.2,.8,.2,1) forwards,nvG2 4.5s 6.2s linear infinite;-webkit-box-reflect:below -6px linear-gradient(transparent 55%,rgba(255,255,255,.2))}
@keyframes itr{to{opacity:1;filter:none;letter-spacing:.16em}}
@keyframes nvG2{to{background-position:-300% 0}}
#isub{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.45em;color:var(--g);font-size:clamp(.5rem,1.7vw,1rem);opacity:0;animation:iu 1.4s 6s forwards}
#iar{font-weight:800;color:#f1ecff;font-size:clamp(1rem,2.6vw,1.6rem);opacity:0;direction:rtl;animation:iu 1.4s 6.8s forwards}
@keyframes iu{from{opacity:0;filter:blur(10px);transform:translateY(16px)}to{opacity:1;filter:none;transform:none}}
#icred{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .9s;background:radial-gradient(circle at 50% 45%,rgba(76,29,149,.5),rgba(3,1,10,.95) 70%)}
#icred.on{opacity:1}
.cin{text-align:center;direction:ltr;display:flex;flex-direction:column;align-items:center;gap:12px}
.cin i{font-size:3rem;color:#8f9bff;filter:drop-shadow(0 0 22px #5865F2);animation:nvF 3s infinite}
.ct{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.5em;color:var(--g);font-size:clamp(.65rem,2.2vw,1.1rem)}
.cn{display:flex;font-family:'Cinzel',serif;font-weight:900;font-size:clamp(2.2rem,10vw,5rem);letter-spacing:.08em}
